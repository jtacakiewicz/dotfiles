[plugin]
prepend_preloaders = [
    { mime = "image/*", run = "noop" },
    { mime = "video/*", run = "noop" },
    { mime = "application/pdf", run = "noop" }
]
prepend_previewers = [
    { mime = "image/*", run = "noop" },
    { mime = "video/*", run = "noop" },
    { mime = "application/pdf", run = "noop" }
]

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" }
]
xdg-open = [
    { run = 'xdg-open "$1"', desc = "Open with system default" }
]

[open]
prepend_rules = [
    { url = "*.txt", use = "edit" },
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "*", use = "xdg-open" },
    { url = "*/", use = [] } # Prevents directories from opening in external apps
]

