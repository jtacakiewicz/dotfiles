[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" }
]
xdg-open = [
    { run = 'xdg-open "$1"', desc = "Open with system default" }
]

[open]
prepend_rules = [
    { name = "*.txt", use = "edit" },
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/json", use = "edit" },

    { name = "*/", use = "xdg-open" },
    { mime = "*", use = "xdg-open" }
]

